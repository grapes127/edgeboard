name: Import Edgeboard source
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source archive
        shell: bash
        run: |
          set -euo pipefail
          echo '61ac5080c47a9cd374adee52cc2d8609acf2f94774f24bfe064a3ab986cf5497  edgeboard-source.zip' | sha256sum -c -
          unzip -o edgeboard-source.zip -x '.github/*'
          rm edgeboard-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import complete Edgeboard source tree'
          git push origin HEAD:main
